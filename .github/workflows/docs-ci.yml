name: Documentation CI

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/validate-documentation.mjs'
      - '.github/workflows/docs-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/validate-documentation.mjs'
      - '.github/workflows/docs-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Documentation Link & Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe394c31ac53f741083ec0e6ea1859d39e07216f # v4.0.0
        with:
          version: 10.26.1

      - uses: actions/setup-node@39370e3970a6d050c480ff640009e01be55777c3 # v4.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Documentation Links & Syntax
        run: pnpm docs:validate
