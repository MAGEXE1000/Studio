name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/studio-web/**'
      - 'packages/studio-core/**'
      - 'packages/ui-shared/**'
      - 'packages/ui-web/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/studio-web/**'
      - 'packages/studio-core/**'
      - 'packages/ui-shared/**'
      - 'packages/ui-web/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

jobs:
  ci:
    name: Web Build & Verify
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_SYNC_BACKEND_PROVIDER: 'supabase-realtime'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe394c31ac53f741083ec0e6ea1859d39e07216f # v4.0.0
        with:
          version: 10.26.1

      - uses: actions/setup-node@39370e3970a6d050c480ff640009e01be55777c3 # v4.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce Import Boundaries
        run: pnpm lint:imports

      - name: Platform Scope Check
        run: pnpm scope:check --platform shared

      - name: Lint
        run: pnpm lint

      - name: Typecheck Web
        run: pnpm typecheck:web

      - name: Build Web
        run: pnpm build:web

