name: Release Pipeline
run-name: Studio Release - ${{ github.ref_name }}

concurrency:
  group: release-pipeline-${{ github.ref_name }}
  cancel-in-progress: true

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional release note'
        required: false
        default: ''
      release_type:
        description: 'Release Publication Type'
        type: choice
        options:
          - 'stable'
          - 'prerelease'
        default: 'stable'

permissions:
  contents: write
  actions: read
  id-token: write
  deployments: write

jobs:
  release:
    name: Production Release
    runs-on: ubuntu-latest
    env:
      STUDIO_PRODUCTION_RELEASE: 'true'
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_SYNC_BACKEND_PROVIDER: 'supabase-realtime'
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      # =========================================================================
      # STAGE 1: SETUP
      # =========================================================================
      - name: 1. Setup Environment & Keystore
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
        with:
          version: 10.26.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Dependencies & Decode Keystore
        run: |
          pnpm install --frozen-lockfile
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > apps/studio-android/android/app/release.keystore
          fi

      # =========================================================================
      # STAGE 2: BUILD & RELEASE (Single Orchestration Command)
      # =========================================================================
      - name: 2. Build, Sign APK & Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$RELEASE_TYPE" = "prerelease" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          node apps/studio-android/scripts/release-firebase.mjs $PRERELEASE_FLAG

      # =========================================================================
      # STAGE 3: DEPLOY & VERIFY
      # =========================================================================
      - name: Deploy Update Metadata to Firebase CDN
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'
          channelId: live

      - name: 3. Deploy Rules & Verify Production Release
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node scripts/deploy-rules-admin.mjs

          NATIVE_VER=$(node scripts/get-version.mjs)
          echo "Verifying Firebase CDN propagation for version $NATIVE_VER..."
          for i in {1..10}; do
            APP_JSON=$(curl -sf --retry 2 "https://studio-30f44.web.app/app-release.json" || true)
            APP_LIVE=$(echo "$APP_JSON" | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).version}catch(e){'unknown'}")
            if [ "$APP_LIVE" = "$NATIVE_VER" ]; then
              echo "✓ Android Release Post-deploy verification passed (Deployed version: $APP_LIVE)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Deployed app-release.json version mismatch! Expected $NATIVE_VER, got $APP_LIVE"
          exit 1
