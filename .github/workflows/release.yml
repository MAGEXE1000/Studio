name: Release Pipeline
run-name: Studio Release - ${{ github.ref_name }}

concurrency:
  group: release-pipeline-${{ github.ref_name }}
  cancel-in-progress: true

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional release note'
        required: false
        default: ''
      release_type:
        description: 'Release Publication Type'
        type: choice
        options:
          - 'stable'
          - 'prerelease'
        default: 'stable'

permissions:
  contents: write
  actions: read
  id-token: write
  deployments: write

jobs:
  build_package_publish:
    name: Build, Package, Sign & Deploy
    runs-on: ubuntu-latest
    env:
      STUDIO_PRODUCTION_RELEASE: 'true'
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_SYNC_BACKEND_PROVIDER: 'supabase-realtime'
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: 1. Checkout Codebase
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: 2. Setup Toolchains & Build Caches
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 3. Environment & Code Quality Preflight
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || \
             [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "::error::Production signing secrets are missing! Refusing to start release pipeline."
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is missing!"
            exit 1
          fi
          echo "✓ Production secrets validated."

          pnpm check:versions
          pnpm lint:imports
          pnpm check:references
          pnpm check:circular
          echo "✓ All preflight quality & version checks passed cleanly."

      - name: 4. Keystore Setup & Certificate Fingerprint Verification
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > apps/studio-android/android/app/release.keystore
          if [ ! -s apps/studio-android/android/app/release.keystore ]; then
            echo "::error::release.keystore is missing or empty after decoding!"
            exit 1
          fi

          keytool -list -v -keystore apps/studio-android/android/app/release.keystore -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > cert.txt
          FINGERPRINT=$(grep "SHA256:" cert.txt | head -n 1 | cut -d':' -f2- | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(node scripts/get-version.mjs --fingerprint)
          echo "Detected Keystore SHA-256: $FINGERPRINT"
          echo "Expected Production SHA-256: $EXPECTED"
          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "::error::CRITICAL SECURITY FAILURE: Decoded release.keystore SHA-256 fingerprint ($FINGERPRINT) does not match expected production certificate ($EXPECTED)!"
            exit 1
          fi
          echo "✓ Production Keystore Certificate Fingerprint Verified."

      - name: 5. Build, Package, Sign APK & Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          cd apps/studio-android
          PRERELEASE_FLAG=""
          if [ "$RELEASE_TYPE" = "prerelease" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          node scripts/release-firebase.mjs $PRERELEASE_FLAG

      - name: 6. Deploy Update Metadata to Firebase CDN
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'
          channelId: live

      - name: 7. Deploy Firestore Security Rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/deploy-rules-admin.mjs

      - name: 8. Verify Deployed Android Metadata
        run: |
          NATIVE_VER=$(node scripts/get-version.mjs)
          echo "Verifying Firebase CDN propagation for version $NATIVE_VER..."
          for i in {1..10}; do
            APP_JSON=$(curl -sf --retry 2 "https://studio-30f44.web.app/app-release.json" || true)
            APP_LIVE=$(echo "$APP_JSON" | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).version}catch(e){'unknown'}")
            if [ "$APP_LIVE" = "$NATIVE_VER" ]; then
              echo "✓ Android Release Post-deploy verification passed (Deployed version: $APP_LIVE)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Deployed app-release.json version mismatch! Expected $NATIVE_VER, got $APP_LIVE"
          exit 1
