name: Web CI
run-name: Web CI - ${{ github.ref_name }}

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'apps/studio-web/**'
      - 'packages/studio-core/**'
      - 'packages/ui-shared/**'
      - 'packages/ui-web/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - '.github/workflows/web-ci.yml'
    paths-ignore:
      - 'CHANGELOG.md'
      - 'release-notes.md'
      - 'release-manifest.json'
      - 'public/version.json'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/studio-web/**'
      - 'packages/studio-core/**'
      - 'packages/ui-shared/**'
      - 'packages/ui-web/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - '.github/workflows/web-ci.yml'
    paths-ignore:
      - 'CHANGELOG.md'
      - 'release-notes.md'
      - 'release-manifest.json'
      - 'public/version.json'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  ci:
    name: Web Build & Verify
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_SYNC_BACKEND_PROVIDER: 'supabase-realtime'

    steps:
      - name: 🔍 Pipeline Queue & Diagnostic Inspection
        run: |
          echo "=== WEB CI QUEUE DIAGNOSTICS ==="
          echo "Selected Concurrency Group: ci-web-${{ github.ref }}"
          echo "Runner Requested: ubuntu-latest"
          echo "Workflow Event: ${{ github.event_name }}"
          echo "Target Ref: ${{ github.ref }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Allocation Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "================================"
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.26.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce Import Boundaries
        run: pnpm lint:imports

      - name: Platform Scope Check
        run: pnpm scope:check --platform shared

      - name: Lint
        run: pnpm lint

      - name: Build Packages
        run: pnpm typecheck:libs

      - name: Typecheck Web
        run: pnpm typecheck:web

      - name: Build Web
        run: pnpm build:web
