name: Release Pipeline
run-name: Studio Release - ${{ github.ref_name }}

concurrency:
  group: "production-release"
  cancel-in-progress: false
on:
  workflow_dispatch:
    inputs:

      note:
        description: "Optional release note"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      STUDIO_PRODUCTION_RELEASE: "true"
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_SYNC_BACKEND_PROVIDER: "supabase-realtime"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_SIGNATURE_SHA256: "900cf259185c81100cda8bb08571fa23552e9789131cf07a8f4056e4d4129206"
      REINSTALL_REQUIRED: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Not Already Published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -e "const fs = require('fs'); const src = fs.readFileSync('packages/studio-core/src/lib/startup/appVersion.ts', 'utf8'); const m = src.match(/export\s+const\s+NATIVE_VERSION\s*=\s*['\"]([^'\"]+)['\"]/); console.log(m ? m[1] : 'unknown');")
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists! Aborting duplicate release."
            exit 1
          fi
          echo "Release $TAG not yet published. Proceeding..."

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce Import Boundaries
        run: pnpm lint:imports

      - name: Assert Production Signing Secrets
        run: |
          if [ "${{ env.STUDIO_PRODUCTION_RELEASE }}" != "true" ]; then
            echo "::error::STUDIO_PRODUCTION_RELEASE flag is missing or not set to true!"
            exit 1
          fi
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || \
             [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "::error::Production signing secrets are missing. Refusing to publish release APK."
            exit 1
          fi

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > apps/studio-android/android/app/release.keystore

      - name: Verify Keystore File
        run: |
          if [ ! -s apps/studio-android/android/app/release.keystore ]; then
            echo "::error::release.keystore is missing or empty!"
            exit 1
          fi

      - name: Run Android Release Script
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/studio-android
          node scripts/release-firebase.mjs --no-bump > build.log 2>&1 || {
            status=$?
            echo "::error::Android release script failed with status $status"
            cat build.log
            exit $status
          }



      - name: Deploy Update Metadata to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'
          channelId: live

      - name: Verify Deployed Android Metadata
        run: |
          echo "Waiting 15s for Firebase CDN propagation..."
          sleep 15
          NATIVE_VER=$(node -e "const fs = require('fs'); const src = fs.readFileSync('packages/studio-core/src/lib/startup/appVersion.ts', 'utf8'); const m = src.match(/export\s+const\s+NATIVE_VERSION\s*=\s*['\"]([^'\"]+)['\"]/); console.log(m ? m[1] : 'unknown');")
          
          echo "--- Fetching app-release.json ---"
          APP_JSON=$(curl -sf --retry 3 "https://studio-30f44.web.app/app-release.json")
          APP_LIVE=$(echo "$APP_JSON" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          echo "Deployed app-release.json version = $APP_LIVE"
          if [ "$APP_LIVE" != "$NATIVE_VER" ]; then
            echo "::error::Deployed app-release.json version mismatch! Expected $NATIVE_VER, got $APP_LIVE"
            exit 1
          fi

          echo "✓ Android Release Post-deploy verification passed"
