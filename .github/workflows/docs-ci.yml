name: Documentation CI

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/validate-documentation.mjs'
      - '.github/workflows/docs-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/validate-documentation.mjs'
      - '.github/workflows/docs-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Documentation Link & Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Documentation Links & Syntax
        run: pnpm docs:validate
