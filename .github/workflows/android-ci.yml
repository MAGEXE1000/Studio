name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/studio-android/**'
      - 'packages/studio-core/**'
      - 'packages/ui-shared/**'
      - 'packages/ui-android/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/studio-android/**'
      - 'packages/studio-core/**'
      - 'packages/ui-shared/**'
      - 'packages/ui-android/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

jobs:
  ci:
    name: Android Build & Verify
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: 'https://mock-supabase.local'
      VITE_SUPABASE_ANON_KEY: 'mock-anon-key'
      VITE_SYNC_BACKEND_PROVIDER: 'supabase-realtime'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce Import Boundaries
        run: pnpm lint:imports

      - name: Run Reference Audit
        run: pnpm check:references

      - name: Run Circular Dependency Check
        run: pnpm check:circular

      - name: Lint
        run: pnpm lint

      - name: Typecheck Android
        run: pnpm typecheck:android

      - name: Build Web and Android Web Assets
        run: pnpm build

      - name: Capacitor Sync
        run: pnpm --filter @workspace/studio-android android:sync

      - name: Run Android Architecture Tests
        run: pnpm test:android

      - name: Build Debug APK
        run: |
          cd apps/studio-android/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Validate Debug APK Artifact
        run: |
          AAPT_PATH=$(find $ANDROID_HOME/build-tools -name aapt -type f | head -n 1)
          if [ -z "$AAPT_PATH" ]; then
            echo "::error::Could not find aapt utility"
            exit 1
          fi
          echo "Found aapt at $AAPT_PATH"

          APK_PATH="apps/studio-android/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Debug APK does not exist!"
            exit 1
          fi

          SIZE=$(stat -c%s "$APK_PATH")
          echo "APK Size: $SIZE bytes"
          if [ "$SIZE" -le 0 ]; then
            echo "::error::APK size is zero!"
            exit 1
          fi

          BADGING=$($AAPT_PATH dump badging "$APK_PATH")

          if ! echo "$BADGING" | grep -q "package: name='com.chordex.app'"; then
            echo "::error::Invalid package name!"
            exit 1
          fi

          if ! echo "$BADGING" | grep -q "application-debuggable"; then
            echo "::error::APK is not debuggable!"
            exit 1
          fi

          echo "✓ Debug APK validation passed successfully!"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/studio-android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
